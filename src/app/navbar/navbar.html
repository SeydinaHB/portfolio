<header class="fixed top-0 left-0 w-full z-50 bg-slate-900/90 backdrop-blur border-b border-slate-700">
  <nav class="max-w-5xl mx-auto flex items-center justify-between px-6 py-4">
    <a href="#hero" (click)="close()" class="text-xl font-bold text-white">Mohamed <span class="text-emerald-400">Ndiaye</span></a>

    <ul class="hidden md:flex gap-6 text-sm text-slate-300">
      @for (l of links; track l.href) {
        <li><a [href]="l.href" class="hover:text-emerald-400 transition">{{ l.label }}</a></li>
      }
    </ul>

    <div class="flex items-center gap-1">
      <button type="button" (click)="toggleTheme()" class="p-2 text-slate-300 hover:text-emerald-400 transition"
              [attr.aria-label]="dark() ? 'Passer au thème clair' : 'Passer au thème sombre'">
        @if (dark()) {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path stroke-linecap="round" d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        } @else {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
        }
      </button>

      <button type="button" (click)="toggle()" class="md:hidden p-2 text-slate-200" aria-label="Ouvrir le menu" [attr.aria-expanded]="open()">
        @if (open()) {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" /></svg>
        } @else {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" /></svg>
        }
      </button>
    </div>
  </nav>

  @if (open()) {
    <ul class="md:hidden flex flex-col px-6 pb-4 border-t border-slate-700 text-slate-300">
      @for (l of links; track l.href) {
        <li><a [href]="l.href" (click)="close()" class="block py-3 hover:text-emerald-400 transition">{{ l.label }}</a></li>
      }
    </ul>
  }
</header>
