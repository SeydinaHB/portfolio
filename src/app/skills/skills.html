<section id="skills" class="py-24 px-6 bg-slate-900/50">
  <div class="max-w-5xl mx-auto">
    <h2 class="text-3xl font-bold text-white mb-12">Mes <span class="text-emerald-400">compétences</span></h2>

    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (cat of categories; track cat.title) {
        <div class="rounded-xl bg-slate-800 border border-slate-700 p-6">
          <h3 class="text-lg font-semibold text-emerald-400 mb-4">{{ cat.title }}</h3>
          <div class="flex flex-wrap gap-2">
            @for (item of cat.items; track item) {
              <span class="px-3 py-1 rounded-full bg-slate-900 border border-slate-700 text-slate-300 text-sm">{{ item }}</span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
